<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>도검남사 대사 마크다운 표 통합 변환기</title>
  <link rel="stylesheet" href="style.css">
<style>
    .tab-panel { display: none; }
    .tab-panel.active {
        display: flex;
        flex-direction: column;
        flex: 1;                        /* 남은 세로 공간 모두 차지 */
        min-height: 0;                  /* flex 자식이 축소 가능하도록 */
    }

    .container {
        display: flex;
        gap: 20px;
        flex: 1;
        min-height: 0;                  /* ★ 중요: 자식 textarea가 넘치지 않게 */
        padding: 15px 0px;
    }
    .box {
        flex: 1;
        display: flex;
		border: 1px solid var(--color-menu-bg);
        flex-direction: column;
        min-height: 0;                  /* ★ 중요 */
    }
    .item-label {
      padding: 10px;
      font-weight: 600;
      display: flex;
    }
    .box label { margin-bottom: 6px; }
    textarea {
        width: 100%;
        flex: 1;                        /* box 안에서 남은 높이 모두 차지 */
        min-height: 200px;              /* 너무 작아지지 않게 안전장치 */
        padding: 12px;
		border: none;
		resize: vertical;
		outline: none;
        font-family: monospace;
        font-size: 13px;
        box-sizing: border-box;
    }
    .controls { margin: 10px 0; display: flex; gap: 10px; align-items: center; }
    }
</style>
</head>
<body style="background:var(--color-white);">
  
  <nav id="bar">
    <div class="controls">
		<button type="button" class="detail-tab-btn active" data-target="tab1" onclick="switchTab('tab1')">1. 도검남사 본성 대사 변환기</button>
		<button type="button" class="detail-tab-btn" data-target="tab2" onclick="switchTab('tab2')">2. 난무 레벨 대사 변환기</button>
		<button type="button" class="detail-tab-btn" data-target="tab3" onclick="switchTab('tab3')">3. 기간 한정 대사 변환기</button>
    </div>
  </nav>
  
    <!-- 1. 본성 대사 변환기 -->
    <section id="tab1" class="tab-panel active">
      <div class="controls">
        <button type="button" class="tag tag-blue" onclick="Converter1.convert()">대사를 마크다운 표로 변환</button>
        <button type="button" class="tag tag-gray" onclick="copyTextarea('output1', this)">결과 복사하기</button>
        <span id="typetag1" class="tag btn-delete">대기 중</span>
      </div>

      <div class="container">
        <div class="box">
			<label class="item-label">[ 원본 텍스트 입력 ]</label>
			<textarea id="input1" placeholder="대사 텍스트를 여기에 붙여넣으세요"></textarea>
		</div>
        <div class="box">
			<label class="item-label">[ 변환된 마크다운 표 ]</label>
			<textarea id="output1" readonly placeholder="변환된 결과가 여기에 표시됩니다"></textarea>
		</div>
	  </div>

    </section>

    <!-- 2. 난무 대사 변환기 -->
    <section id="tab2" class="tab-panel">
      <div class="controls">
        <button type="button" class="tag tag-yellow" onclick="Converter2.convert()">대사를 마크다운 표로 변환</button>
        <button type="button" class="tag tag-gray" onclick="copyTextarea('output2', this)">결과 복사하기</button>
      </div>
      <div class="container">
        <div class="box">
          <label for="input2" class="item-label">[ 원본 텍스트 입력 ]</label>
          <textarea id="input2" placeholder="레벨2&#10;계속 건드리기(통상)&#10;"></textarea>
        </div>
        <div class="box">
          <label for="output2" class="item-label">[ 변환된 마크다운 표 ]</label>
          <textarea id="output2" readonly placeholder="변환된 표가 여기에 표시됩니다"></textarea>
        </div>
      </div>
    </section>

    <!-- 3. 한정 대사 변환기 -->
    <section id="tab3" class="tab-panel">
      <div class="controls">
        <button type="button" class="tag tag-green" onclick="Converter3.convert()">대사를 마크다운 표로 변환</button>
        <button type="button" class="tag tag-gray" onclick="copyTextarea('output3', this)">결과 복사하기</button>
      </div>
      <div class="container">
        <div class="box">
          <label for="input3" class="item-label">[ 원본 텍스트 입력 ]</label>
          <textarea id="input3" placeholder="새해 인사&#10;新年の挨拶回りですか？"></textarea>
        </div>
        <div class="box">
          <label for="output3" class="item-label">[ 변환된 마크다운 표 ]</label>
          <textarea id="output3" readonly placeholder="변환된 표가 여기에 표시됩니다"></textarea>
        </div>
      </div>
    </section>



  <script>
    /* =========================================================
       공통 UI 유틸리티 (탭 전환 및 클립보드 복사)
       ========================================================= */
function switchTab(targetId) {
  // ★ #bar 안의 탭 버튼만 대상으로 한정
  document.querySelectorAll('#bar .detail-tab-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.target === targetId);
  });
  document.querySelectorAll('.tab-panel').forEach(panel => {
    panel.classList.toggle('active', panel.id === targetId);
  });
}

    function copyTextarea(elementId, btnElement) {
      const out = document.getElementById(elementId);
      if (!out.value) return;
      out.select();
      document.execCommand("copy");

      const originalText = btnElement.textContent;
      btnElement.textContent = "복사 완료!";
      setTimeout(() => { btnElement.textContent = originalText; }, 1200);
    }

    /* =========================================================
       모듈 1: 본성 대사 표 변환기 (convert1.html 원본 로직)
       ========================================================= */
    const Converter1 = (() => {
      const NORMAL_SITUATIONS = [
        "로그인 (로딩중)", "로그인 (로딩완료)", "로그인 (게임시작)", "입수",
        "본성 (통상 1)", "본성 (통상 2)", "본성 (통상 3)", "본성 (방치)", "본성 (부상)",
        "부대 (대장)", "부대 (대원)", "장비 1", "장비 2", "장비 3",
        "출진", "중(重)상시 행군 경고", "자원발견", "보스발견", "탐색",
        "개전 (출진)", "개전 (훈련)", "공격 1", "공격 2", "회심의 일격",
        "경상 1", "경상 2", "중상", "진검필살", "일기토", "이도개안", "MVP", "랭크업", "임무완료",
        "당번 (말)", "당번 (말 완료)", "당번 (밭)", "당번 (밭 완료)", "당번 (대련)", "당번 (대련 완료)",
        "원정 (시작)", "원정 (귀환-대장)", "원정 (귀환-근시)", "도검제작", "장비제작",
        "수리 (경상이하)", "수리 (중상이상)", "합성", "전적", "상점",
        "아이템 (도시락)", "아이템 (한입당고)", "축하 도시락", "사니와 장기부재 귀환",
        "콩뿌리기 (실행 1)", "콩뿌리기 (실행 2)", "콩뿌리기 (실행 후)",
        "꽃구경", "단오",
        "불꽃놀이 1", "불꽃놀이 2", "불꽃놀이 3",
        "불꽃놀이 (소원 1)", "불꽃놀이 (소원 2)", "불꽃놀이 (소원 3)",
        "수행 (개시)", "수행 (배웅)", "파괴"
      ];

      const KIWAME_SITUATIONS = [
        "입수",
        "본성 (통상 1)", "본성 (통상 2)", "본성 (통상 3)", "본성 (방치)", "본성 (부상)",
        "부대 (대장)", "부대 (대원)", "장비 1", "장비 2", "장비 3",
        "출진", "중(重)상시 행군 경고", "자원발견", "보스발견", "탐색",
        "개전 (출진)", "개전 (훈련)", "공격 1", "공격 2", "회심의 일격",
        "경상 1", "경상 2", "중상", "진검필살", "일기토", "이도개안", "MVP", "극 개화 100레벨", "임무완료",
        "당번 (말)", "당번 (말 완료)", "당번 (밭)", "당번 (밭 완료)", "당번 (대련)", "당번 (대련 완료)",
        "원정 (시작)", "원정 (귀환-대장)", "원정 (귀환-근시)", "도검제작", "장비제작",
        "수리 (경상이하)", "수리 (중상이상)", "합성", "전적", "상점",
        "아이템 (도시락)", "아이템 (한입당고)", "아이템 (축하 도시락)", "사니와 장기부재 귀환",
        "콩뿌리기 (실행 1)", "콩뿌리기 (실행 2)", "콩뿌리기 (실행 후)",
        "꽃구경", "단오",
        "불꽃놀이 1", "불꽃놀이 2", "불꽃놀이 3",
        "불꽃놀이 (소원 1)", "불꽃놀이 (소원 2)", "불꽃놀이 (소원 3)",
        "수행 (배웅)", "파괴"
      ];

      const PARENTS = new Set(["로그인", "본성", "부대", "개전", "당번", "원정", "수리", "아이템", "콩뿌리기", "수행"]);
      const MULTI_MAP = {
        "본성 (통상)": ["본성 (통상 1)", "본성 (통상 2)", "본성 (통상 3)"],
        "장비": ["장비 1", "장비 2", "장비 3"],
        "공격": ["공격 1", "공격 2"],
        "경상": ["경상 1", "경상 2"],
        "콩뿌리기 (실행)": ["콩뿌리기 (실행 1)", "콩뿌리기 (실행 2)"],
        "불꽃놀이": ["불꽃놀이 1", "불꽃놀이 2", "불꽃놀이 3"],
        "불꽃놀이 (소원)": ["불꽃놀이 (소원 1)", "불꽃놀이 (소원 2)", "불꽃놀이 (소원 3)"]
      };

      const singleKeywords = new Set([
        "입수", "장비", "출진", "중(重)상시 행군 경고", "자원발견", "보스발견", "탐색",
        "공격", "회심의 일격", "경상", "중상", "진검필살", "일기토", "이도개안",
        "MVP", "랭크업", "극 개화 100레벨", "임무완료", "도검제작", "장비제작",
        "합성", "전적", "상점", "축하 도시락", "사니와 장기부재 귀환",
        "꽃구경", "단오", "불꽃놀이", "불꽃놀이(소원)", "수행 배웅", "파괴"
      ]);

      const subKeywords = new Set([
        "로딩중", "로딩완료", "게임시작", "통상", "방치", "부상",
        "대장", "대원", "출진", "훈련", "말", "말 완료", "밭", "밭 완료",
        "대련", "대련 완료", "시작", "귀환(대장)", "귀환(근시)",
        "경상이하", "중상이상", "도시락", "한입당고", "축하 도시락",
        "실행", "실행 후", "개시", "배웅"
      ]);

      function normalizeKey(parent, sub, isKiwame) {
        let key = sub ? `${parent} (${sub})` : parent;
        key = key.replace("귀환(대장)", "귀환-대장")
                 .replace("귀환(근시)", "귀환-근시")
                 .replace("불꽃놀이(소원)", "불꽃놀이 (소원)")
                 .replace("수행 배웅", "수행 (배웅)");
        if (isKiwame && key === "축하 도시락") key = "아이템 (축하 도시락)";
        if (!isKiwame && key === "아이템 (축하 도시락)") key = "축하 도시락";
        return key;
      }

      function convert() {
        const raw = document.getElementById("input1").value;
        const isKiwame = raw.includes("극 개화 100레벨");
        const isNormal = raw.includes("랭크업");

        const tag = document.getElementById("typetag1");
        if (isKiwame) {
          tag.textContent = "판별 결과: 극 대사";
          tag.style.background = "#fef3c7"; tag.style.color = "#92400e";
        } else if (isNormal) {
          tag.textContent = "판별 결과: 통상 대사";
          tag.style.background = "#dbeafe"; tag.style.color = "#1e40af";
        } else {
          tag.textContent = "판별 불가 (기본: 통상 대사 기준)";
          tag.style.background = "#eee"; tag.style.color = "#333";
        }

        let lines = raw.split(/\r?\n/)
          .map(l => l.replace(/\[\d+\]/g, "").trim())
          .filter(l => l && !["상황", "대사(원문)", "대사(번역)"].includes(l));

        const dataMap = {};
        let currentParent = "";
        let currentKey = "";
        let buffer = [];

        function flushBuffer() {
          if (!currentKey || buffer.length === 0) return;
          const pairs = [];
          for (let i = 0; i < buffer.length; i += 2) {
            pairs.push([buffer[i], buffer[i + 1] || ""]);
          }
          if (MULTI_MAP[currentKey]) {
            MULTI_MAP[currentKey].forEach((subKey, idx) => {
              if (pairs[idx]) dataMap[subKey] = pairs[idx];
            });
          } else {
            dataMap[currentKey] = pairs[0];
          }
          buffer = [];
        }

        for (let i = 0; i < lines.length; i++) {
          const line = lines[i];
          if (PARENTS.has(line)) {
            flushBuffer();
            currentParent = line;
            currentKey = "";
          } else if (currentParent && subKeywords.has(line)) {
            if (line === "출진" && currentParent !== "개전") {
              flushBuffer();
              currentParent = "";
              currentKey = "출진";
            } else {
              flushBuffer();
              currentKey = normalizeKey(currentParent, line, isKiwame);
            }
          } else if (singleKeywords.has(line)) {
            flushBuffer();
            currentParent = "";
            currentKey = normalizeKey(line, "", isKiwame);
          } else {
            if (currentKey) buffer.push(line);
          }
        }
        flushBuffer();

        const targetList = isKiwame ? KIWAME_SITUATIONS : NORMAL_SITUATIONS;
        let md = "| 상황 | 일본어 원문 | 한글 번역 |\n| :--- | :--- | :--- |\n";
        targetList.forEach(sit => {
          if (dataMap[sit]) {
            md += `| ${sit} | ${dataMap[sit][0]} | ${dataMap[sit][1]} |\n`;
          }
        });

        document.getElementById("output1").value = md.trim();
      }

      return { convert };
    })();

    /* =========================================================
       모듈 2: 난무 대사 표 변환기 (convert2.html 원본 로직)
       ========================================================= */
    const Converter2 = (() => {
      const KNOWN_SITUATIONS = new Set([
        "계속 건드리기(통상)", "계속 건드리기 (통상)",
        "계속 건드리기(중상)", "계속 건드리기 (중상)",
        "도검제작 완료", "수리 완료", "이벤트 알림", "보물 완성",
        "보물 장비", "자동행군 의뢰",
        "배경설정", "장비제작 실패", "말 장비", "부적 장비",
        "출진 결정",
        "달성 기념",
        "선물(행복)", "선물 (행복)",
        "선물(보통)", "선물 (보통)",
        "선물(별로)", "선물 (별로)"
      ]);

      function formatSituationName(level, rawSit) {
        const cleanSit = rawSit.replace(/\s*\(/g, " (").trim();
        return level ? `${level} - ${cleanSit}` : cleanSit;
      }

      function convert() {
        const raw = document.getElementById("input2").value;
        const lines = raw.split(/\r?\n/)
          .map(l => l.replace(/\[\d+\]/g, "").replace(/\u3000/g, " ").trim())
          .filter(l => l && !["상황", "대사(원문)", "대사(번역)"].includes(l));

        let currentLevel = "";
        let currentSit = "";
        let buffer = [];
        const records = [];

        function flush() {
          if (!currentSit || buffer.length === 0) return;
          const pairs = [];
          for (let i = 0; i < buffer.length; i += 2) {
            pairs.push([buffer[i], buffer[i + 1] || ""]);
          }
          const baseTitle = formatSituationName(currentLevel, currentSit);
          if (pairs.length > 1) {
            pairs.forEach((p, idx) => {
              records.push({ title: `${baseTitle} ${idx + 1}`, jp: p[0], kr: p[1] });
            });
          } else {
            records.push({ title: baseTitle, jp: pairs[0][0], kr: pairs[0][1] });
          }
          buffer = [];
        }

        for (let i = 0; i < lines.length; i++) {
          const line = lines[i];
          if (/^레벨\d+$/.test(line)) {
            flush();
            currentLevel = line;
            currentSit = "";
          } else if (KNOWN_SITUATIONS.has(line)) {
            flush();
            currentSit = line;
          } else {
            if (currentSit) {
              buffer.push(line);
            }
          }
        }
        flush();

        let md = "| 상황 | 일본어 원문 | 한글 번역 |\n| :--- | :--- | :--- |\n";
        records.forEach(r => {
          md += `| ${r.title} | ${r.jp} | ${r.kr} |\n`;
        });

        document.getElementById("output2").value = md.trim();
      }

      return { convert };
    })();

    /* =========================================================
       모듈 3: 한정 대사 표 변환기 (convert3.html 원본 로직)
       ========================================================= */
    const Converter3 = (() => {
      const PARENTS = new Set(["오미쿠지", "절분", "천냥상자"]);

      const SINGLE_MAP = {
        "새해 인사": "새해 인사",
        "연대전 부대교체": "연대전 - 부대교체",
        "대침구 연격": "대침구 - 연격"
      };

      const SUB_MAP = {
        "오미쿠지|시작": "오미쿠지 - 시작",
        "오미쿠지|소길": "오미쿠지 - 소길",
        "오미쿠지|중길": "오미쿠지 - 중길",
        "오미쿠지|대길": "오미쿠지 - 대길",
        "절분|출진": "절분 - 출진",
        "절분|보스발견": "절분 - 보스발견",
        "천냥상자|1층 개시/부대장": "천냥상자 - 1층 개시 (부대장)",
        "천냥상자|천냥상자 발견/부대원": "천냥상자 - 상자 발견 (부대원)"
      };

      const MULTI_MAP = {
        "천냥상자|특정 층 제패/부대장": [
          "천냥상자 - 50층 제패 (부대장)",
          "천냥상자 - 99층 제패 (부대장)"
        ],
        "천냥상자|특정 층 도달/부대원": [
          "천냥상자 - 10층 도달 (부대원)",
          "천냥상자 - 20층 도달 (부대원)",
          "천냥상자 - 30층 도달 (부대원)",
          "천냥상자 - 40층 도달 (부대원)",
          "천냥상자 - 50층 도달 (부대원)",
          "천냥상자 - 60층 도달 (부대원)",
          "천냥상자 - 70층 도달 (부대원)",
          "천냥상자 - 80층 도달 (부대원)",
          "천냥상자 - 90층 도달 (부대원)",
          "천냥상자 - 99층 도달 (부대원)"
        ]
      };

      function isAnniversary(line) {
        return /^(도검난무|사니와 취임)\s*\d+주년$/.test(line);
      }

      function convert() {
        const raw = document.getElementById("input3").value;
        let rawLines = raw.split(/\r?\n/)
          .map(l => l.replace(/\[\d+\]/g, "").replace(/\u3000/g, " ").trim())
          .filter(l => l && !["상황", "대사(원문)", "대사(번역)"].includes(l));

        const lines = [];
        let charBuf = "";
        for (const l of rawLines) {
          if (/^[가-힣]$/.test(l)) {
            charBuf += l;
          } else {
            if (charBuf) {
              lines.push(charBuf);
              charBuf = "";
            }
            lines.push(l);
          }
        }
        if (charBuf) lines.push(charBuf);

        let currentParent = "";
        let currentKey = "";
        let buffer = [];
        const records = [];

        function flush() {
          if (!currentKey || buffer.length === 0) return;
          const pairs = [];
          for (let i = 0; i < buffer.length; i += 2) {
            pairs.push([buffer[i], buffer[i + 1] || ""]);
          }

          if (MULTI_MAP[currentKey]) {
            const labels = MULTI_MAP[currentKey];
            pairs.forEach((p, idx) => {
              const label = labels[idx] || `${currentKey.split("|")[1]} ${idx + 1}`;
              records.push({ title: label, jp: p[0], kr: p[1] });
            });
          } else if (SUB_MAP[currentKey]) {
            records.push({ title: SUB_MAP[currentKey], jp: pairs[0][0], kr: pairs[0][1] });
          } else if (SINGLE_MAP[currentKey]) {
            records.push({ title: SINGLE_MAP[currentKey], jp: pairs[0][0], kr: pairs[0][1] });
          } else {
            records.push({ title: currentKey, jp: pairs[0][0], kr: pairs[0][1] });
          }
          buffer = [];
        }

        for (const line of lines) {
          if (PARENTS.has(line)) {
            flush();
            currentParent = line;
            currentKey = "";
          } else if (SINGLE_MAP[line] || isAnniversary(line)) {
            flush();
            currentParent = "";
            currentKey = line;
          } else if (currentParent && (SUB_MAP[`${currentParent}|${line}`] || MULTI_MAP[`${currentParent}|${line}`])) {
            flush();
            currentKey = `${currentParent}|${line}`;
          } else {
            if (currentKey) {
              buffer.push(line);
            }
          }
        }
        flush();

        let md = "| 상황 | 일본어 원문 | 한글 번역 |\n| :--- | :--- | :--- |\n";
        records.forEach(r => {
          md += `| ${r.title} | ${r.jp} | ${r.kr} |\n`;
        });

        document.getElementById("output3").value = md.trim();
      }

      return { convert };
    })();
  </script>
</body>
</html>
